# ==========================================
# MediaCrawler 基础设施 (MySQL + Redis)
# 表结构由 ORM 管理：pnpm db:up 或 pnpm db:init
# Docker 仅执行 sql/00_init.sql 创建数据库
# ==========================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 重置:  docker compose down -v && docker compose up -d
# ==========================================

services:
  mysql:
    image: mysql:8.0
    container_name: mediacrawler-mysql
    restart: unless-stopped
    ports:
      - '${MYSQL_HOST_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-media_crawler}
      TZ: Asia/Shanghai
    volumes:
      - mediacrawler_mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-123456}',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: mediacrawler-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD:-123456} --appendonly yes
    volumes:
      - mediacrawler_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-123456}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediacrawler_mysql_data:
  mediacrawler_redis_data:
